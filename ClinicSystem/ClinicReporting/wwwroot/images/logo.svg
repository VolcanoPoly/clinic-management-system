<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a6fc4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a6fc4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shine overlay -->
  <rect width="200" height="200" rx="44" fill="url(#shine)"/>

  <!-- Medical cross — vertical bar -->
  <rect x="84" y="44" width="32" height="112" rx="10" fill="white"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="44" y="84" width="112" height="32" rx="10" fill="white"/>

  <!-- Small pulse dot accent bottom-right -->
  <circle cx="158" cy="158" r="14" fill="rgba(255,255,255,0.25)"/>
  <circle cx="158" cy="158" r="7" fill="white"/>
</svg>
